<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join QR Bike Race</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="phone-body">
    <main class="phone">
      <section id="name-card" class="phone-card">
        <p class="kicker">QR Bike Race</p>
        <h1>名前を入力</h1>
        <form id="join-form">
          <input
            id="name-input"
            type="text"
            maxlength="4"
            autocomplete="nickname"
            inputmode="text"
            placeholder="4文字"
            aria-label="表示名"
          />
          <button type="submit">参加</button>
        </form>
        <p class="phone-message" id="message">4文字まで表示できます</p>
      </section>

      <section id="controller" class="controller hidden">
        <div class="rider-badge">
          <span id="rider-dot"></span>
          <strong id="rider-name"></strong>
        </div>
        <div class="phase-text" id="phase-text"></div>
        <div class="pedals">
          <button id="left" type="button">L</button>
          <button id="right" type="button">R</button>
        </div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/join.js"></script>
  </body>
</html>
